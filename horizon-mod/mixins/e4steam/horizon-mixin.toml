# e4steam as a Horizon native mod: one support module, six hook points and the mod's own crate.
#
# The bundle folder is named after `[mod] id` (the registry finds it there), and the id takes only
# lowercase letters, digits and `_`.

[mod]
id = "e4steam"
version = "0.1.0"
priority = 100

# The Nightly this was built and played on (its hook points run to API 40). Hook points keep their
# contract across releases, but the payload also reads `Game`'s private `lan` field, which is not part
# of that contract — hence a commit pin instead of `"hooks"`, so a drifted Horizon fails the plan
# instead of building something broken.
[compatibility]
horizon_revision = "aa27eca326db26e999d4e59d7899576016764b1e"

# The protocol, the Steamworks binding and the bridge. Staged as a workspace member and added to
# horizon-client's dependencies, so the game crate reaches it as `e4steam_engine`.
[[crate]]
id = "engine"
path = "engine"

# Injected into `crate::game` as a same-crate module: it sees `Game`'s private `lan` field and the
# `pub(super)` helpers, which is why the glue lives here rather than in another crate.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "e4steam"
source = "runtime.rs"

# `/steam host|join|status|stop`, before the server and Horizon's commands see the line (API 35).
[[injection]]
id = "command"
hook = "command"
hook_version = 1
kind = "HEAD"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]

# The chat box colours, completes and lists `/steam` like the game's own commands.
[[injection]]
id = "commands"
hook = "commands"
hook_version = 1
kind = "HEAD"
helper = "commands.rs"
bindings = [{ name = "names", ty = "&mut Vec<&'static str>", value = "commands" }]

# Once a frame, in a world or not: the Steam thread's lines reach chat here.
[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# Options > Mods, opened from the pause menu, lists us with the state on its row.
[[injection]]
id = "mods"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "mods.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "mods" },
]

# Our page's buttons, re-read when it opens and after every press.
[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "buttons" },
]

# The button the player pressed, which is the whole menu: no chat command is needed to share a world.
[[injection]]
id = "press"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "press.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
